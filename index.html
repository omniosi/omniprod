              <!-- litPaint -->
              <feSpecularLighting
                in="blur"
                surfaceScale="2"
                specularConstant=".75"
                specularExponent="20"
                lighting-color="#bbbbbb"
                result="specOut">
                <fePointLight x="-5000" y="-10000" z="20000" />

                in="specOut"
                in2="SourceAlpha"
                operator="in"
                result="specOut" />
              <feComposite
                in="SourceGraphic"
                in2="specOut"
                operator="arithmetic"
                k1="0"
                k2="1"
                k3="1"
                k4="0"
                result="litPaint" />
              <!-- merge offsetBlur + litPaint -->
              <feMerge>
                <feMergeNode in="offsetBlur" />
                <feMergeNode in="litPaint" />
              </feMerge>
            </filter>
